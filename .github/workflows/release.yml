name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: publish crates in dependency order
        run: |
          for c in baztet-protos baztet-projectview baztet-bep baztet-snapshot baztet-core baztet; do
            cargo publish -p "$c"
          done
