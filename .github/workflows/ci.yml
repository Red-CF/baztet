name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # dependency CVE gate: Cargo.lock against the RustSec advisory DB.
  # deny-warnings=false so unmaintained-dep notices don't turn CI red;
  # only real vulnerabilities fail the check
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          deny-warnings: false

  # lint gate: zero warnings allowed (the codebase holds it today; this
  # keeps it from rotting)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings

  coverage:
    # coverage lives on its own named check: instrumented tests on Linux +
    # the gh-pages badge on main. Linux is covered here instead of `test` —
    # test keeps macos/windows only.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov
          cargo llvm-cov --workspace --all-features --exclude baztet --lcov --output-path lcov.info
      - name: update gh-pages badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PCT=$(awk -F: '/^LF:/{lf+=$2}/^LH:/{lh+=$2}END{printf "%.0f", 100*lh/(lf?lf:1)}' lcov.info)
          COLOR=$([ "$PCT" -ge 90 ] && echo 44cc11 || ([ "$PCT" -ge 75 ] && echo 97ca00 || echo dfb317))
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="108" height="20"><rect width="108" height="20" rx="3" fill="#%s"/><text x="54" y="14" font-size="11" font-family="Verdana,sans-serif" fill="#fff" text-anchor="middle">coverage %s%%</text></svg>\n' "$COLOR" "$PCT" > coverage.svg
          URL="https://x-access-token:${GH_TOKEN}@github.com/Red-CF/baztet.git"
          git clone -q --depth=1 --branch=gh-pages "$URL" ghp \
            || { mkdir ghp && git -C ghp init -q -b gh-pages && git -C ghp remote add origin "$URL"; }
          mv coverage.svg ghp/coverage.svg
          git -C ghp -c user.name="Red-CF" -c user.email=crojasfer31@gmail.com add coverage.svg
          git -C ghp -c user.name="Red-CF" -c user.email=crojasfer31@gmail.com commit -q -m "coverage badge: $PCT%" --allow-empty
          git -C ghp push -q origin gh-pages

  test:
    # Linux is exercised inside the `coverage` job (instrumented); the macOS
    # runner handles arm64 natively and cross-builds Intel (see `build`)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  build:
    # release build is what users install — must stay clean on all OSes;
    # the binary also ships with the GitHub release (picked up by `release`)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --package baztet
      - name: also build macOS Intel (runner is ARM)
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --package baztet --target x86_64-apple-darwin
          mkdir -p bins
          cp target/x86_64-apple-darwin/release/baztet bins/baztet-macOS-X64
      - name: stage named binary
        shell: bash
        run: |
          mkdir -p bins
          EXT=$([ "$RUNNER_OS" = "Windows" ] && echo .exe || echo "")
          cp "target/release/baztet$EXT" "bins/baztet-$RUNNER_OS-$RUNNER_ARCH$EXT"
      - uses: actions/upload-artifact@v7
        with:
          name: baztet-${{ runner.os }}
          path: bins/

  version:
    # the merge gate: a PR that changes SHIPPABLE code must bump the baztet
    # version in Cargo.toml above what crates.io has, or the merge button
    # stays locked. Infra PRs (workflow, docs, tests, bench) are excluded:
    # a CI fix must not force a version, and a version-only bump would ship
    # a release without meaning anything.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: does this PR touch shippable code?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename') \
            || { echo "::error::could not list PR files — skipping the gate this way would be fail-open; retry the check"; exit 1; }
          echo "$FILES"
          if echo "$FILES" | grep -qE '^(crates/|Cargo\.(toml|lock)$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR touches no shippable code; version gate skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.code == 'true'
        name: version must be new to crates.io
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          PUBLISHED=""
          for i in 1 2 3; do
            PUBLISHED=$(curl -sfL -A "baztet-ci" "https://crates.io/api/v1/crates/baztet/versions" | jq -r --arg v "$V" '[.versions[].num | select(. == $v)] | length' 2>/dev/null) || true
            [ -n "$PUBLISHED" ] && break
            sleep 3
          done
          [ -n "$PUBLISHED" ] || { echo "::error::registry query failed after 3 tries — retry the check"; exit 1; }
          if [ "$PUBLISHED" != "0" ]; then
            echo "::error::baztet $V is already on crates.io — bump version in Cargo.toml before merging"
            exit 1
          fi

  release:
    # a merge to main ships the crates ONLY when the version is new to
    # crates.io: merges without a version bump (infra PRs, accumulated WIP
    # before a deliberate release) leave everything untouched and the job
    # exits green without publishing anything
    needs: [test, build, coverage, lint, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: decide
        name: release only if this version is new to crates.io
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          KNOWN=""
          for i in 1 2 3; do
            KNOWN=$(curl -sfL -A "baztet-ci" "https://crates.io/api/v1/crates/baztet/versions" | jq -r --arg v "$V" '[.versions[].num | select(. == $v)] | length' 2>/dev/null) || true
            [ -n "$KNOWN" ] && break
            sleep 3
          done
          [ -n "$KNOWN" ] || { echo "::error::registry query failed after 3 tries — re-run the release job"; exit 1; }
          if [ "$KNOWN" != "0" ]; then
            echo "Already-released version $V: no publish (no-release merge)."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: publish crates in dependency order
        if: steps.decide.outputs.release == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for c in baztet-protos baztet-projectview baztet-bep baztet-snapshot baztet-core baztet; do
            cargo publish -p "$c"
          done
      - name: tag + GitHub release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          git config user.name "Carlos Rojas"
          git config user.email "crojasfer31@gmail.com"
          git tag "v$V"
          git push origin "v$V"
          gh release create "v$V" --generate-notes
      - uses: actions/download-artifact@v8
        if: steps.decide.outputs.release == 'true'
        with:
          path: bins
          merge-multiple: true
      - name: attach native binaries
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          gh release upload "v$V" bins/baztet-* --clobber
