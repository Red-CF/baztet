[package]
name = "baztet"
description = "Standalone Bazel project sync and execution CLI (Rust port of the hirschgarten engine)"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
baztet-core = { path = "../baztet-core", version = "0.1.0" }
baztet-projectview = { path = "../baztet-projectview", version = "0.1.0" }
baztet-snapshot = { path = "../baztet-snapshot", version = "0.1.0" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
camino.workspace = true