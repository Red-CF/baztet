[workspace]
resolver = "2"
members = [
    "crates/baztet",
    "crates/baztet-core",
    "crates/baztet-protos",
    "crates/baztet-bep",
    "crates/baztet-projectview",
    "crates/baztet-snapshot",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
prost = "0.13"
prost-types = "0.13"
prost-build = "0.13"
protoc-bin-vendored = "3"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "fs", "sync", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
zstd = "0.13"
thiserror = "2"
anyhow = "1"
camino = { version = "1", features = ["serde1"] }
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1