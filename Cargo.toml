[workspace]
resolver = "2"
members = [
    "crates/baztet",
    "crates/baztet-core",
    "crates/baztet-protos",
    "crates/baztet-bep",
    "crates/baztet-projectview",
    "crates/baztet-snapshot",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Red-CF/baztet"
homepage = "https://github.com/Red-CF/baztet"

[workspace.dependencies]
prost = "0.14"
prost-types = "0.13"
prost-build = "0.13"
prost-reflect = { version = "0.16", features = ["text-format"] }
protoc-bin-vendored = "3"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "fs", "sync", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
zstd = "0.13"
thiserror = "2"
anyhow = "1"
camino = { version = "1", features = ["serde1"] }
sha2 = "0.10"
quick-xml = "0.41"
rayon = "1"
mimalloc = "0.1"
owo-colors = "4"
indicatif = "0.17"

[profile.release]
lto = true
codegen-units = 1
strip = true